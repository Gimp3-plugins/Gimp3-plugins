[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warpforge"
version = "1.0.0rc2"
description = "Puppet Warp and Mesh Warp plug-in for GIMP 3"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "WarpForge contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
# Runtime dependencies are provided by GIMP itself (PyGObject, Gimp/GimpUi/Gegl
# typelibs). The plug-in must run on GIMP's bundled Python, which has no NumPy
# on Windows, so the runtime has no third-party Python dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." lets tests share helpers via `tests.test_warp`
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]
extend-exclude = ["src/warpforge/native/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "RUF"]
# The UI and tests use "×" (multiplication sign) on purpose, e.g. "1920×1080".
ignore = ["RUF001"]
# T20: forbid print(); logging only.

[tool.ruff.lint.isort]
known-first-party = ["warpforge", "tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["warpforge"]
strict = true
# PyGObject ships no type stubs; GIMP-facing modules are checked loosely.
[[tool.mypy.overrides]]
module = ["gi", "gi.*", "cairo"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["warpforge.gimp_bridge", "warpforge.dialog", "warpforge.canvas", "warpforge.plugin"]
disallow_any_unimported = false
disallow_untyped_calls = false
warn_return_any = false
