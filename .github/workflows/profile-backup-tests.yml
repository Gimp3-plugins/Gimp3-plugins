# Testy rdzenia wtyczki Profile Backup (bez GIMP-a): pyflakes + pytest
# na Windows i Ubuntu, Python 3.12 i 3.14 (GIMP 3.2 na Windows ma Pythona 3.14).
# Testy okien w GIMP-ie wykonuje się ręcznie – opis w profile-backup/README.md.
name: profile-backup – testy

on:
  push:
    paths:
      - "profile-backup/**"
      - ".github/workflows/profile-backup-*.yml"
  pull_request:
    paths:
      - "profile-backup/**"
      - ".github/workflows/profile-backup-*.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: profile-backup

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Zależności testów
        run: python -m pip install --upgrade pip pytest pyflakes
      - name: pyflakes
        run: python -m pyflakes plug-ins/profile-backup tests build-release.py
      - name: pytest
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Paczka wydania
        run: python build-release.py
