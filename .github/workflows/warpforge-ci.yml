name: WarpForge CI
on:
  workflow_dispatch:
  push:
    paths: ['warpforge/**', '.github/workflows/warpforge-ci.yml']
  pull_request:
    paths: ['warpforge/**', '.github/workflows/warpforge-ci.yml']
permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warpforge/src/warpforge/native
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: warpforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The native library is loaded by the tests (backend parity, speed, leaks).
      - run: cargo build --release --manifest-path src/warpforge/native/Cargo.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: warpforge-${{ matrix.os }}
          path: warpforge/dist/*.zip
