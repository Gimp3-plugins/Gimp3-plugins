[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["build", "tests/profile", "tests/output"]

[tool.ruff.lint]
# Syntax errors, all Pyflakes checks (unused imports/variables, undefined names)
# and flake8-bugbear (late-binding closures, unused loop variables, raise-from).
select = ["E9", "F", "B"]
